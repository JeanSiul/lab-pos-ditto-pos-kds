name: Import DittoPOS upstream

on:
  push:
    paths:
      - ".github/workflows/import-ditto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream
        run: git clone --depth 1 https://github.com/getditto/demoapp-pos-kds.git /tmp/upstream

      - name: Replace benchmark contents with upstream
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude '.git' --exclude '.github' /tmp/upstream/ ./
          cat > BENCHMARK_SOURCE.md <<'EOF'
          # Benchmark source

          This repository is an isolated evaluation copy of the public project `getditto/demoapp-pos-kds`.

          - Upstream: https://github.com/getditto/demoapp-pos-kds
          - License: MIT
          - Purpose: evaluate POS -> KDS flows, order state transitions, offline/sync behavior and UI ideas for independent implementation.

          The upstream LICENSE and copyright notices are preserved.
          EOF

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import DittoPOS benchmark source"
          git push origin HEAD:main
